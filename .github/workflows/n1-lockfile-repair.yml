name: N1 isolated npm lockfile repair

on:
  push:
    branches:
      - security/n1-proof-boundaries-20261025
    paths:
      - .github/workflows/n1-lockfile-repair.yml

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve safe nonbreaking dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.repair.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install declared locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Use npm 11 Arborist with fixed peer-graph handling
        run: |
          npm install --global npm@11.21.1 --ignore-scripts
          npm --version
      - name: Produce an auditable package-lock-only proposal
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          npm audit fix --package-lock-only --ignore-scripts > evidence/npm-audit-fix.log 2>&1
          fix_code=$?
          set -e
          echo "$fix_code" > evidence/audit-fix-exit.txt
          # npm 10 peer-resolution crashes used exit 1, just like advisory
          # results. Never claim an Arborist exception is a valid audit result.
          if grep -qi "^npm error" evidence/npm-audit-fix.log; then
            cat evidence/npm-audit-fix.log
            exit 70
          fi
          if [ "$fix_code" -gt 1 ]; then
            cat evidence/npm-audit-fix.log
            exit "$fix_code"
          fi
          # Never silently expand declared direct-dependency ranges or alter source.
          git diff --exit-code -- package.json
          npm ci --ignore-scripts --no-audit
          sha256sum package-lock.json > evidence/package-lock.sha256
          set +e
          npm audit --json > evidence/npm-audit-after.json
          audit_code=$?
          set -e
          echo "$audit_code" > evidence/npm-audit-exit.txt
          if [ "$audit_code" -gt 1 ]; then
            echo "Audit infrastructure failure: $audit_code" >&2
            exit "$audit_code"
          fi
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Nonbreaking lockfile proposal generated; audit status=$audit_code (1 means vulnerabilities remain)."
      - name: Upload exact proposed lockfile and independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-lockfile-proposal-${{ github.sha }}
          if-no-files-found: error
          path: |
            package-lock.json
            evidence/npm-audit-fix.log
            evidence/audit-fix-exit.txt
            evidence/npm-audit-after.json
            evidence/npm-audit-exit.txt
            evidence/package-lock.sha256

  apply:
    name: Commit only verified lockfile to this development branch
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' && github.repository == 'OuroborosCollective/SovAreAgentn1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/n1-proof-boundaries-20261025
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: n1-lockfile-proposal-${{ github.sha }}
          path: proposal
      - name: Verify proposal and commit only package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          (cd proposal && sha256sum --check evidence/package-lock.sha256)
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const lock = JSON.parse(fs.readFileSync("proposal/package-lock.json", "utf8"));
            assert.equal(lock.lockfileVersion, 3);
            assert.equal(lock.packages[""].name, pkg.name);
            assert.deepEqual(lock.packages[""].workspaces, pkg.workspaces);
          '
          cp proposal/package-lock.json package-lock.json
          git diff --exit-code -- package.json
          if git diff --quiet -- package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          test "$(git diff --name-only)" = 'package-lock.json'
          git add package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): apply nonbreaking npm lockfile audit repairs'
          git push origin HEAD:refs/heads/security/n1-proof-boundaries-20261025