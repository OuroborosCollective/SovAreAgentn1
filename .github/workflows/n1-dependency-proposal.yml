name: N1 bounded dependency proposal
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/n1-dependency-proposal.yml]
permissions:
  contents: read
jobs:
  propose:
    if: github.head_ref == 'security/n1-proof-boundaries-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve one pinned middleware and preserve source receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proposal
          git rev-parse HEAD > proposal/source.sha
          npx --yes npm@11.21.1 install --package-lock-only --ignore-scripts --save-exact express-rate-limit@8.7.3
          cp package.json package-lock.json proposal/
          npx --yes npm@11.21.1 ci
          npx --yes npm@11.21.1 audit --audit-level=high
          tar -czf proposal/development-dependencies.tar.gz node_modules
          sha256sum proposal/package.json proposal/package-lock.json proposal/development-dependencies.tar.gz > proposal/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: n1-rate-limit-proposal-${{ github.sha }}
          path: proposal/
          retention-days: 1
          if-no-files-found: error
# This job proposes bytes only. It has no write permission, secrets, publish or deployment step.
