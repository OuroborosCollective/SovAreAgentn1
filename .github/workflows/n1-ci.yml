name: N+1 System CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: n-plus-1-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-and-audit:
    name: Security, Audit, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js runtime
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: true

      - name: Record runtime versions
        run: |
          mkdir -p evidence
          {
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          } | tee evidence/runtime-context.txt

      - name: Install dependencies deterministically
        run: npm ci

      - name: Dependency audit
        id: dependency-audit
        continue-on-error: true
        run: |
          npm audit \
            --audit-level=critical \
            --json \
            > evidence/npm-audit.json

      - name: Generate CycloneDX SBOM
        run: |
          npm sbom \
            --sbom-format cyclonedx \
            --sbom-type application \
            > evidence/sbom.cdx.json

      - name: Run tests
        run: npm test --if-present

      - name: Run lint checks
        run: npm run lint --if-present

      - name: Run type checks
        run: npm run typecheck --if-present

      - name: Build project
        run: npm run build --if-present

      - name: Generate evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "audit_outcome=${{ steps.dependency-audit.outcome }}"
          } > evidence/evidence-manifest.txt

          find evidence \
            -maxdepth 1 \
            -type f \
            ! -name "checksums.sha256" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > evidence/checksums.sha256

          sha256sum --check evidence/checksums.sha256

      - name: Upload security and CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n-plus-1-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce dependency audit result
        if: always() && steps.dependency-audit.outcome == 'failure'
        run: |
          echo "::error::npm audit detected at least one critical vulnerability."
          exit 1

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  ci-verdict:
    name: N+1 CI Verdict
    if: always()
    needs:
      - security-and-audit
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify all required jobs
        shell: bash
        run: |
          security_result="${{ needs.security-and-audit.result }}"
          codeql_result="${{ needs.codeql.result }}"

          echo "Security and audit: ${security_result}"
          echo "CodeQL: ${codeql_result}"

          if [[ "${security_result}" != "success" ]]; then
            echo "::error::Security, audit, test, or build job did not succeed."
            exit 1
          fi

          if [[ "${codeql_result}" != "success" ]]; then
            echo "::error::CodeQL analysis did not succeed."
            exit 1
          fi

          echo "N+1 CI verdict: verified success"
