name: N+1 System Package Distribution

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version Bump Level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  build-and-test:
    name: Architecture & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || npm install

      - name: Run Architecture Diagnostics & System Bug Hunt
        run: node bin/install.js --diagnostics

      - name: Lint Codebase & Type Check
        run: npm run lint

      - name: Build Bundled Distribution Server
        run: npm run build

  publish-npm:
    name: Release & Publish to NPM Registry
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies
        run: npm install

      - name: Automatic Version Bump
        run: |
          BUMP=${{ inputs.bump_type || 'patch' }}
          npm version $BUMP -m "chore(release): bump package version to %s [skip ci]"

      - name: Build Standalone Distribution Engine
        run: npm run build

      - name: Publish to NPM Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "NPM_TOKEN not set in repository secrets. Skipping actual npm publish step."
          fi

      - name: Push Git Version Tag
        run: git push origin --follow-tags || true
